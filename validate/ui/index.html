<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validate</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Validate</h1>
        <div class="row">
          <button id="run" disabled>Run</button>
          <button id="stop-server" disabled>Stop server</button>
        </div>
      </header>

      <form id="project-form">
        <label for="project">Project folder</label>
        <div class="row">
          <input
            id="project"
            required
            placeholder="/absolute/path/to/project"
          >
          <button id="open">Open</button>
        </div>
      </form>

      <p id="error" role="alert"></p>

      <section>
        <h2>Validation steps</h2>
        <label class="execution-option">
          <input id="use-nix" type="checkbox">
          Use project’s Nix shell
        </label>

        <div id="steps" class="step-groups"></div>

        <details id="catalog">
          <summary>Add steps</summary>
          <input
            id="step-search"
            type="search"
            placeholder="Search available steps…"
            aria-label="Search available steps"
          >
          <div id="available-steps"></div>
        </details>

      </section>

      <section>
        <h2>Runs</h2>
        <div id="history" class="run-list" aria-label="Run history"></div>
        <button id="history-more" class="more" hidden>More</button>
        <p id="summary">No runs yet.</p>
        <div id="results"></div>

      </section>
    </main>
  </body>
</html>
